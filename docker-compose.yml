services:
  admin:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      API_UPSTREAM: https://sunudekk-api.djazael.com
      API_HOST: sunudekk-api.djazael.com
    ports:
      - "8080:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
