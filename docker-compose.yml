services:
  admin:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Propage la var d'env Dokploy au build. Si non definie, le defaut
        # du Dockerfile (ARG API_BASE_URL=...) prend le relais.
        API_BASE_URL: ${API_BASE_URL:-}
    restart: unless-stopped
    ports:
      - "8080:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
