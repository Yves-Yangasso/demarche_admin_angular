server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Cache long pour les assets hashes (outputHashing=all en prod).
    location ~* \.(?:js|css|woff2?|svg|ico|png|jpg|jpeg|gif|webp)$ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA routing : tout chemin inconnu -> index.html (Angular Router prend la main).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
